version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    # Major versions are deliberate upgrades, not routine bumps.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    # Major versions are deliberate upgrades, not routine bumps.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
